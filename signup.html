<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sonia Flower Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        
        
        <h1 style="color: aliceblue;">Sonia Flower Shop</h1>
        <p style="text-align: center; color: rgb(239, 243, 243); font-weight: bold;margin-right: 7%;">Create your account to start shopping 🌸</p>
    </header>

    <div id="body">
        <p style="text-align: center; color: rgb(230, 233, 233); font-weight: bold;margin-right: 7%;">SIGN UP</p>
        <input type="text" id="names" placeholder=" Enter your names"><br><br>
        <input type="email" id="email" placeholder=" Enter your email Username"><br><br>
        <input type="tel" id="phone" placeholder="Enter phone number"><br><br>
        <input type="text" id="signup-name" placeholder=" Create Username"><br><br>
        <input type="password" id="signup-pass" placeholder="Create a Password"><br><br>
        
        <input type="button" id="signup-btn" value="Register Account" style="background-color: #d63384; color: white; padding: 10px; border-radius: 5px; cursor: pointer; border: none;">
        
        <p style="color: white; font-size: 14px; margin-top: 15px;margin-right: 7%;">
            Already have an account? <a href="log in.html" style="color: aqua;">Log in here</a>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
