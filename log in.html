<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sonia Flower Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       
        <h3 style="margin-top: 5%;text-align: center; color: white;">WELCOME TO SONIA FASHION SHOP</h3> 
    </header>

    <div id="body">
        <p style="margin-top: 10%;text-align: center; color: aqua; font-weight: bold;margin-right: 7%;">LOG IN</p>
        <input type="text" id="login-name" placeholder="Enter your name"><br><br>
        <input type="password" id="login-pass" placeholder="Enter your password"><br><br>
        
        <input type="button" id="login-submit" value="Log in" style="background-color: rgb(236, 223, 223); cursor: pointer;">
        
        <p style="color: white; font-size: 14px; margin-top: 15px;margin-right: 7%;">
            New customer? <a href="signup.html" style="color: aqua;">Create an account</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
